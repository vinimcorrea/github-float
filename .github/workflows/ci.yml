name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Smoke test screenshots
        run: .build/release/GitHubFloat --screenshots /tmp/shots && ls /tmp/shots
