name: 🐛 Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: GitHub Float version
      placeholder: "1.0.0"
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.1"
  - type: dropdown
    id: owner
    attributes:
      label: Project type
      options: [Organization project, User project]
